<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket de báscula · Corporación Sayula</title>
<style>
  :root { --azul:#1a5fb4; --gris:#5e6470; --fondo:#f4f6f9; --ok:#2e7d32; --err:#c62828; --aviso:#8a5a00; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--fondo); color:#1c1f24; }
  .caja { max-width:480px; margin:0 auto; padding:20px 16px 40px; }
  .logo { display:block; height:110px; width:auto; margin:4px auto 12px; mix-blend-mode:multiply; }
  h1 { font-size:22px; margin:8px 0 4px; }
  p.sub { color:var(--gris); margin:0 0 20px; font-size:15px; }
  label { display:block; font-weight:600; margin:16px 0 6px; font-size:15px; }
  select, input[type=text], textarea { width:100%; font-size:17px; padding:12px; border:1px solid #c5cad3; border-radius:10px; background:#fff; font-family:inherit; }
  .fijo { font-size:17px; padding:12px; border-radius:10px; background:#e9edf3; font-weight:600; }
  select:disabled { background:#e9edf3; color:#1c1f24; }
  textarea { min-height:70px; resize:vertical; }
  .nota { font-size:13px; color:var(--gris); margin-top:6px; }
  .nota.aviso { color:var(--aviso); }
  .oculto { display:none; }
  .foto { display:block; border:2px dashed #9aa3b2; border-radius:12px; padding:22px; text-align:center; background:#fff; cursor:pointer; color:var(--gris); font-weight:400; }
  .foto img { max-width:100%; max-height:260px; border-radius:8px; display:none; margin:0 auto; }
  input[type=file] { display:none; }
  button { width:100%; margin-top:24px; padding:15px; font-size:18px; font-weight:700; color:#fff; background:var(--azul); border:0; border-radius:12px; }
  button:disabled { opacity:.6; }
  #msg { margin-top:16px; font-size:16px; text-align:center; min-height:24px; }
  .ok { color:var(--ok); } .err { color:var(--err); }
</style>

  <h1>📸 Ticket de báscula</h1>
  <p class="sub">Toma la foto completa del ticket, derecha y que se lean los pesos.</p>

  <label>Transportista</label>
  <div id="tr" class="fijo"></div>

  <label for="oc">Número de Orden de Carga</label>
  <select id="oc" disabled><option value="">Primero elige el transportista</option></select>
  <div id="notaOc" class="nota"></div>

  <div id="cajaManual" class="oculto">
    <label for="ocManual">Escribe el número de orden de carga</label>
    <input type="text" id="ocManual" autocomplete="off" placeholder="Ej. CSA 4382 OM" style="text-transform:uppercase">
    <div class="nota aviso">Este ticket quedará marcado para revisión de logística.</div>
  </div>

  <label for="obs">Observaciones <span id="obsReq" style="font-weight:400;color:var(--gris)">(opcional)</span></label>
  <textarea id="obs" maxlength="300" placeholder="Ej. segunda pesada, ticket de regreso, faltó sello…"></textarea>

  <label>Foto del ticket</label>
  <label class="foto" for="archivo"><span id="txtFoto">📷 Toca aquí para abrir la cámara</span><img id="vista" alt=""></label>
  <input type="file" id="archivo" accept="image/*" capture="environment">

  <button id="btn" onclick="enviar()">Enviar ticket</button>
  <div id="msg"></div>
</div>
<script>
  // Dirección de la Aplicación web de Apps Script (la misma de Power Query)
  const API = 'https://script.google.com/macros/s/AKfycbzGsM6DjU8TQ-Hz6njae5Zct9eqCKV6drGlOZ11ulmdcoO0xvkjM-mrrJSfWetzsXfO/exec';
  const PRE = new URLSearchParams(location.search).get('t') || '';
  const MANUAL = '__manual__';
  let imagen = null;
  const $ = id => document.getElementById(id);
  const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const norm = s => String(s || '').toUpperCase().normalize('NFD').replace(/[^A-Z0-9 ]/g, '').replace(/\s+/g, ' ').trim();

  // El transportista viene fijo en el enlace de cada grupo; el operador nunca ve los demás
  const TRANSPORTISTA = String(PRE || '').trim();
  if (TRANSPORTISTA) { $('tr').textContent = TRANSPORTISTA; cargarOrdenes(); }
  else {
    $('tr').textContent = 'Usa el enlace que está fijado en tu grupo de WhatsApp';
    $('tr').style.color = 'var(--err)'; $('btn').disabled = true;
  }
  $('oc').addEventListener('change', () => {
    const manual = $('oc').value === MANUAL;
    $('cajaManual').classList.toggle('oculto', !manual);
    $('obsReq').textContent = manual ? '(obligatorio: explica por qué no aparece)' : '(opcional)';
  });

  function cargarOrdenes() {
    const t = TRANSPORTISTA;
    $('oc').disabled = true; $('cajaManual').classList.add('oculto'); $('notaOc').textContent = '';
    if (!t) { $('oc').innerHTML = '<option value="">Primero elige el transportista</option>'; return; }
    $('oc').innerHTML = '<option value="">Cargando órdenes…</option>';
    fetch(API + '?accion=ordenes&t=' + encodeURIComponent(t)).then(r => r.json()).then(res => {
      if (!res.ok) throw new Error(res.error);
      const ordenes = res.ordenes;
      $('oc').innerHTML = '<option value="">' + (ordenes.length ? 'Elige tu orden…' : 'No hay órdenes abiertas') + '</option>' +
        ordenes.map(o => '<option value="' + esc(o.oc) + '">' + esc(o.oc) + ' · ' + esc(o.fecha) + (o.placas ? ' · ' + esc(o.placas) : '') + '</option>').join('') +
        '<option value="' + MANUAL + '">⚠️ No aparece mi orden</option>';
      $('oc').disabled = false;
      $('notaOc').textContent = ordenes.length === 1 ? '1 orden abierta de los últimos 30 días.' : ordenes.length + ' órdenes abiertas de los últimos 30 días.';
    }).catch(e => aviso('No se pudieron cargar las órdenes. Revisa tu señal y vuelve a abrir el enlace.', true));
  }

  // Reduce la foto en el celular (máx. 2000 px) para que suba rápido con poca señal
  $('archivo').addEventListener('change', ev => {
    const f = ev.target.files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 2000 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/jpeg', 0.85);
      imagen = url.split(',')[1];
      $('vista').src = url; $('vista').style.display = 'block'; $('txtFoto').style.display = 'none';
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => aviso('No se pudo abrir la foto, intenta con otra.', true);
    img.src = URL.createObjectURL(f);
  });

  function aviso(t, err) { $('msg').textContent = t; $('msg').className = err ? 'err' : 'ok'; }

  function enviar() {
    const manual = $('oc').value === MANUAL;
    const d = { transportista: TRANSPORTISTA, manual, imagen,
                oc: manual ? $('ocManual').value.trim().toUpperCase() : $('oc').value,
                obs: $('obs').value.trim() };
    if (!d.transportista) return aviso('Usa el enlace de tu grupo de WhatsApp.', true);
    if (!d.oc) return aviso(manual ? 'Escribe el número de orden de carga.' : 'Elige tu orden de carga.', true);
    if (manual && !d.obs) return aviso('Explica en Observaciones por qué no aparece tu orden.', true);
    if (!d.imagen) return aviso('Falta la foto del ticket.', true);
    $('btn').disabled = true; aviso('Enviando…');
    // text/plain evita que el navegador pida permiso previo (CORS) a Google
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                 body: JSON.stringify(Object.assign({ accion: 'subirTicket' }, d)) })
    .then(r => r.json()).then(res => {
      if (!res.ok) throw new Error(res.error);
      aviso('✅ Ticket enviado. ¡Gracias!');
      imagen = null; $('archivo').value = ''; $('obs').value = ''; $('ocManual').value = '';
      $('oc').value = ''; $('cajaManual').classList.add('oculto'); $('obsReq').textContent = '(opcional)';
      $('vista').style.display = 'none'; $('txtFoto').style.display = 'inline';
      $('btn').disabled = false; $('btn').textContent = 'Enviar otro ticket';
    }).catch(e => { aviso('No se envió: ' + (e.message || 'sin señal') + '. Intenta de nuevo.', true); $('btn').disabled = false; });
  }
</script>
<!-- Dictado por voz: botón de micrófono en cada campo de texto (convierte la voz en texto, español de México) -->
<style>
.voz-w{position:relative;display:block}
.voz-w textarea,.voz-w input{padding-right:54px!important;width:100%;box-sizing:border-box}
.voz-b{position:absolute;right:6px;bottom:6px;width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;
  background:var(--accent,var(--azul,#1a5fb4));color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.voz-b svg{width:20px;height:20px}
.voz-b.on{background:#c62828;animation:vozp 1s infinite}
@keyframes vozp{50%{box-shadow:0 0 0 8px rgba(198,40,40,.25)}}
.voz-msg{font-size:12.5px;color:#c62828;margin-top:4px}
</style>
<script>
(function () {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const MIC = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>';
  let activo = null;
  function aviso(w, t) {
    let m = w.nextElementSibling;
    if (!m || !m.classList.contains('voz-msg')) { m = document.createElement('div'); m.className = 'voz-msg'; w.after(m); }
    m.textContent = t; setTimeout(() => m.remove(), 7000);
  }
  function iniciar(el, b, w) {
    const r = new SR();
    r.lang = 'es-MX'; r.interimResults = true; r.continuous = true;
    const base = el.value ? el.value.replace(/\s*$/, ' ') : '';
    let fin = '';
    r.onresult = e => {
      let tmp = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) fin += t.trim() + ' '; else tmp += t;
      }
      let v = base + fin + tmp;
      if (el.maxLength > 0) v = v.slice(0, el.maxLength);
      el.value = v;
      el.dispatchEvent(new Event('input', { bubbles: true }));
    };
    r.onerror = e => aviso(w, e.error === 'not-allowed' || e.error === 'service-not-allowed'
      ? 'Permite el micrófono para esta página (candado junto a la dirección).'
      : e.error === 'no-speech' ? 'No se escuchó nada. Toca el micrófono y habla.' : 'No se pudo dictar. Intenta otra vez.');
    r.onend = () => { b.classList.remove('on'); b.setAttribute('aria-label', 'Dictar con la voz'); activo = null; el.value = el.value.trim(); };
    try { r.start(); activo = r; b.classList.add('on'); b.setAttribute('aria-label', 'Detener dictado'); }
    catch (x) { aviso(w, 'No se pudo abrir el micrófono.'); }
  }
  function poner(el) {
    if (el.dataset.vozOk) return;
    el.dataset.vozOk = '1';
    const w = document.createElement('span'); w.className = 'voz-w';
    el.parentNode.insertBefore(w, el); w.appendChild(el);
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'voz-b'; b.title = 'Dictar con la voz'; b.setAttribute('aria-label', 'Dictar con la voz'); b.innerHTML = MIC;
    w.appendChild(b);
    b.onclick = () => {
      if (!SR) { aviso(w, 'Este navegador no permite dictar. Ábrela en Chrome o Safari, o usa el micrófono del teclado.'); return; }
      if (activo) { activo.stop(); return; }
      iniciar(el, b, w);
    };
  }
  const buscar = () => document.querySelectorAll('textarea, input[data-voz]').forEach(poner);
  buscar();
  new MutationObserver(buscar).observe(document.body, { childList: true, subtree: true });
})();
</script>
