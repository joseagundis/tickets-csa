<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rastreo de órdenes de carga</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Portal de rastreo para clientes. Datos: Apps Script (/exec). Sin librerías externas. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --fg:#1b2220; --muted:#5d6a64; --line:#dce2df;
  --accent:#1f6f5c; --accent-soft:#e1efea;
  --st-tran:#a86400; --st-ok:#2c7a3f; --st-warn:#b3261e; --st-doc:#6b3fa0; --st-com:#2f5fa8;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#131816; --surface:#1b221f; --fg:#e6ebe8; --muted:#98a59f; --line:#2b3531;
  --accent:#5cc0a3; --accent-soft:#1d3830;
  --st-tran:#e0a54a; --st-ok:#6cc483; --st-warn:#f08b84; --st-doc:#b996e3; --st-com:#7ea6e6; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
[hidden]{display:none!important}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.btn{cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:8px;padding:10px 16px;font-weight:600}
.btn.sec{background:transparent;color:var(--accent)}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}
/* Login */
#login{max-width:380px;margin:6vh auto 0;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
#login .logo{height:90px;width:auto;align-self:center;mix-blend-mode:multiply;border-radius:6px}
@media (prefers-color-scheme: dark){#login .logo{mix-blend-mode:normal;background:#fff;padding:4px}}
#login h1{font-size:20px;margin:0;text-align:center}
#login p{margin:0;color:var(--muted);text-align:center;font-size:13.5px}
#login label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.err{color:var(--st-warn);font-size:13.5px;min-height:1.2em;margin:0}
/* App */
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 16px}
header h1{font-size:21px;margin:0;font-weight:600;text-wrap:balance}
header .sub{color:var(--muted);font-size:13px}
.hright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hright select{width:auto;min-width:160px}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:800px){.grid{grid-template-columns:minmax(0,1fr)}}
.list{padding:12px;display:flex;flex-direction:column;gap:6px;max-height:80vh;overflow:auto}
@media (max-width:800px){.list{max-height:46vh}}
.list input{margin-bottom:4px}
.oc{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px 12px;border-radius:8px;border:1px solid transparent}
.oc:hover{background:var(--bg)}
.oc[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.oc .num{font-family:var(--mono);font-size:14px;white-space:nowrap}
.oc .meta{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.pill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;align-self:center;
  color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.vacio{color:var(--muted);padding:8px 4px;font-size:14px}
.right{display:flex;flex-direction:column;gap:16px;min-width:0}
.track{padding:22px 22px 18px;display:flex;flex-direction:column;gap:18px}
.ocid{font-size:13px;color:var(--muted)}
.ocid span{font-family:var(--mono);color:var(--fg)}
.big{font-size:26px;font-weight:700;line-height:1.2;margin:2px 0 0;color:var(--c);text-wrap:balance}
.bigsub{margin-top:4px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));list-style:none;padding:0;margin:0}
.steps li{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:12.5px;color:var(--muted);padding:0 2px}
.steps li::before{content:"";position:absolute;top:9px;left:-50%;width:100%;height:3px;background:var(--line)}
.steps li:first-child::before{display:none}
.steps li.done::before,.steps li.now::before{background:var(--accent)}
.steps .b{position:relative;z-index:1;width:21px;height:21px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.steps li.done .b{background:var(--accent);border-color:var(--accent)}
.steps li.now .b{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.steps .n{color:var(--fg);font-weight:500}
.steps li.now .n{font-weight:700}
.steps .h{font-variant-numeric:tabular-nums;font-size:11.5px}
.times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);padding-top:14px;margin:0}
@media (max-width:520px){.times{grid-template-columns:minmax(0,1fr)}.big{font-size:22px}}
.times dt,.datos dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.times dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums}
.times dd small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.card{padding:18px 22px;display:flex;flex-direction:column;gap:12px}
h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0;font-weight:600}
.docs{display:flex;flex-wrap:wrap;gap:8px}
.doc{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0;color:inherit;text-decoration:none}
.doc:hover{border-color:var(--accent)}
.doc .ic{flex:none;width:30px;height:36px;border-radius:4px;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:var(--surface);background:var(--c)}
.doc .dn{font-weight:600;font-size:14px}
.doc .dm{font-size:12px;color:var(--muted)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.foto{margin:0;display:flex;flex-direction:column;gap:4px}
.foto a{display:block}
.foto img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.foto figcaption{font-size:12.5px;color:var(--muted)}
.datos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 16px;margin:0}
.datos dd{margin:2px 0 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ev{position:relative;padding:0 0 16px 36px}
.ev .dot{position:absolute;left:4px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--c)}
.ev .when{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ev .t{font-weight:600}
.ev .by{font-size:12.5px;color:var(--muted)}
a{color:var(--accent)}
.cargando{color:var(--muted);padding:24px}
.form{display:flex;flex-direction:column;gap:10px}
.form label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.form textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);min-height:64px;resize:vertical}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fila>*{flex:1 1 180px}
.chk{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--fg)!important}
.chk input{width:auto}
.camara{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:10px;padding:18px;cursor:pointer;color:var(--accent);font-weight:600;text-align:center}
.camara img{max-width:100%;max-height:260px;border-radius:8px}
.nota{font-size:12.5px;color:var(--muted);margin:0}
.ok{color:var(--st-ok);font-size:13.5px;margin:0}
.interno{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;color:var(--st-warn);background:color-mix(in srgb,var(--st-warn) 12%,transparent);margin-left:6px}
.lnk{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;font-size:12.5px}
.aviso{font-size:12.5px;color:var(--muted);background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin:0}
</style>
</head>

<script>

function diaTexto(p){

  const hoy = hoyMx(); const t = Date.parse(hoy+'T12:00:00Z'), x = Date.parse(k+'T12:00:00Z');
  const dif = Math.round((x - t) / 864e5);
  if (dif === 0) return 'hoy'; if (dif === 1) return 'mañana'; if (dif === -1) return 'ayer';
  return `${p.d} ${MESES[p.mo-1]}`;
}
const hora = p => p && p.h != null ? `${p.h}:${String(p.mi).padStart(2,'0')}` : '';
function fCorta(s){ const p = partes(s); if (!p) return ''; return `${diaTexto(p)}${p.h!=null?' '+hora(p):''}`; }
function rango(s){ const p = partes(s); if (!p || p.h == null) return ''; const ini = p.h*60+p.mi-30, fin = p.h*60+p.mi+30;
  const hm = m => `${Math.floor(((m+1440)%1440)/60)}:${String(((m%60)+60)%60).padStart(2,'0')}`; return `${diaTexto(p)} entre ${hm(ini)} y ${hm(fin)}`; }

/* ---------- API ---------- */
async function api(cuerpo){
  const r = await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(cuerpo) });
  const j = await r.json();
  if (!j.ok && j.error === 'sesion') { salir(j.mensaje); throw new Error('sesion'); }
  return j;
}

/* ---------- Login ---------- */
$('#login').addEventListener('submit', async ev => {
  ev.preventDefault();
  $('#errLogin').textContent = ''; $('#btnEntrar').disabled = true; $('#btnEntrar').textContent = 'Entrando…';
  try {
    const j = await api({ accion:'login', usuario: $('#usuario').value, clave: $('#clave').value });
    if (!j.ok) { $('#errLogin').textContent = j.mensaje || 'No se pudo entrar.'; return; }
    S = Object.assign(S, { sesion:j.sesion, nombre:j.nombre, rol:j.rol, cuentas:j.cuentas || [], cuenta: j.rol === 'csa' ? '' : j.cuenta });
    guardar('rastreo_sesion', S.sesion); guardar('rastreo_nombre', S.nombre); guardar('rastreo_rol', S.rol);
    guardar('rastreo_cuentas', JSON.stringify(S.cuentas)); guardar('rastreo_cuenta', S.cuenta);
    $('#clave').value = '';
    mostrarApp();
  } catch (e) { if (e.message !== 'sesion') $('#errLogin').textContent = 'Sin conexión. Revisa tu internet e intenta de nuevo.'; }
  finally { $('#btnEntrar').disabled = false; $('#btnEntrar').textContent = 'Entrar'; }
});
function salir(msg){
  ['rastreo_sesion','rastreo_nombre','rastreo_rol','rastreo_cuentas','rastreo_cuenta'].forEach(k => guardar(k, null));
  S = { sesion:null, nombre:'', rol:'', cuentas:[], cuenta:'', ordenes:[], sel:null, hist:null };
  $('#app').hidden = true; $('#login').hidden = false; $('#errLogin').textContent = msg || '';
}
$('#btnSalir').onclick = () => salir();
$('#btnActualizar').onclick = () => cargarLista();
$('#selCuenta').onchange = e => { S.cuenta = e.target.value; guardar('rastreo_cuenta', S.cuenta); S.sel = null; cargarLista(); };
$('#q').addEventListener('input', pintarLista);

function mostrarApp(){
  $('#login').hidden = true; $('#app').hidden = false;
  const csa = S.rol === 'csa';
  $('#selCuenta').hidden = !csa;
  if (csa) $('#selCuenta').innerHTML = '<option value="">Todos los clientes</option>' + S.cuentas.map(c => `<option${c===S.cuenta?' selected':''}>${esc(c)}</option>`).join('');
  cargarLista();
}

/* ---------- Lista ---------- */
function resumen(o){
  if (o.etapa === 'Entregada') return ['Entregada', '--st-ok'];
  if (o.llegadaEst && o.etapa === 'En camino') return ['Llega ' + fCorta(o.llegadaEst), '--accent'];
  return [o.etapa, o.etapa === 'Programada' ? '--st-com' : '--st-tran'];
}
async function cargarLista(){
  if (!S.ordenes.length) $('#ocs').innerHTML = '<div class="vacio">Cargando…</div>';
  try {
    const j = await api({ accion:'misOCa', sesion:S.sesion, cuenta:S.cuenta });
    if (!j.ok) { $('#ocs').innerHTML = `<div class="vacio">${esc(j.mensaje || j.error)}</div>`; return; }
    S.ordenes = j.ordenes;
    const quien = S.rol === 'csa' ? 'CSA · ' + (S.cuenta || 'Todos los clientes') : (j.cuenta || S.nombre);
    $('#titulo').textContent = quien + (S.rol === 'transportista' ? ' · Mis órdenes de carga' : ' · Rastreo de órdenes de carga');
    $('#actualizado').textContent = 'Actualizado ' + fCorta(j.actualizado) + ' · se refresca cada 2 minutos';
    if (!S.sel && S.ordenes.length) S.sel = S.ordenes[0].clave;
    pintarLista();
    if (S.sel) cargarDetalle(S.sel); else $('#detail').innerHTML = '<div class="panel cargando">Aún no hay órdenes de carga en los últimos 60 días.</div>';
  } catch (e) { if (e.message !== 'sesion') $('#actualizado').textContent = 'Sin conexión. Se reintentará en 2 minutos.'; }
}
function pintarLista(){
  const q = $('#q').value.trim().toLowerCase();
  const filas = S.ordenes.filter(o => !q || [o.folio,o.productos,o.placas,o.remision,o.destino].join(' ').toLowerCase().includes(q));
  $('#ocs').innerHTML = filas.map(o => { const [t,c] = resumen(o); return `<button class="oc" type="button" aria-current="${o.clave===S.sel}" data-c="${esc(o.clave)}">
    <span class="num">${esc(o.folio)}</span><span class="pill" style="--c:var(${c})">${esc(t)}</span>
    <span class="meta">${esc(o.productos)}${S.rol==='csa'&&!S.cuenta?' · '+esc(o.cuenta||'Sin cliente'):''}${S.rol==='transportista'?' · '+esc(o.placas):''} · ${esc(fCorta(o.fecha))}${o.pendientes?` · <b style="color:var(--st-warn)">${o.pendientes} por revisar</b>`:''}</span></button>`; }).join('')
    || '<div class="vacio">Ninguna orden coincide.</div>';
  document.querySelectorAll('.oc').forEach(b => b.onclick = () => { S.sel = b.dataset.c; pintarLista(); cargarDetalle(S.sel); });
}

/* ---------- Detalle ---------- */
async function cargarDetalle(clave){
  if (!S.hist || S.hist.oca.clave !== clave) $('#detail').innerHTML = '<div class="panel cargando">Cargando la orden de carga…</div>';
  try {
    const j = await api({ accion:'historiaOCa', sesion:S.sesion, clave });
    if (clave !== S.sel) return;
    if (!j.ok) { $('#detail').innerHTML = `<div class="panel cargando">${esc(j.mensaje || j.error)}</div>`; return; }
    S.hist = j; pintarDetalle(j.oca, j.eventos);
  } catch (e) {}
}
function encabezado(o){
  if (o.etapa === 'Entregada') return ['Entregada ' + (fCorta(o.entrega) || ''), '--st-ok'];
  if (o.llegadaEst) return ['Llega ' + rango(o.llegadaEst), '--accent'];
  if (o.etapa === 'En camino') return ['En camino' + (o.salida ? ' desde ' + fCorta(o.salida) : ''), '--accent'];
  if (o.etapa === 'Cargada') return ['Cargada, por salir', '--st-tran'];
  return ['Programada' + (o.fecha ? ' para ' + fCorta(o.fecha) : ''), '--st-com'];
}
function pintarDetalle(o, ev){
  const [big, color] = encabezado(o);
  const i = Math.max(0, ETAPAS.indexOf(o.etapa));
  const ub = o.ultimaUbicacion;
  const sub = ub ? `Último reporte: ${esc(ub.lugar)}, ${esc(fCorta(ub.fecha))}.` : (o.etapa === 'Programada' ? 'Te avisaremos aquí cada movimiento del viaje.' : '');
  const tickets = ev.filter(e => e.tipo === 'Ticket' && urlOk(e.foto));
  const fotos = ev.filter(e => urlOk(e.foto));
  $('#detail').innerHTML = `
  <section class="panel track">
    <div>
      <div class="ocid">Orden de carga <span>${esc(o.folio)}</span> · ${esc(o.productos)}</div>
      <p class="big" style="--c:var(${color})">${esc(big)}</p>
      <div class="bigsub">${sub}</div>
    </div>
    <ol class="steps">${ETAPAS.map((p,k) => `<li class="${k<i?'done':k===i?'now':''}"><span class="b"></span><span class="n">${p}</span><span class="h">${esc(fCorta(o.horas[p])) || '&nbsp;'}</span></li>`).join('')}</ol>
    <dl class="times">
      <div><dt>Salida de origen</dt><dd>${o.salida ? esc(fCorta(o.salida)) : 'Pendiente'}<small>${esc(o.origen)}</small></dd></div>
      <div><dt>${o.etapa==='Entregada'?'Entregada':'Llegada estimada'}</dt><dd>${o.etapa==='Entregada' ? esc(fCorta(o.entrega)) : (o.llegadaEst ? esc(fCorta(o.llegadaEst)) + ' aprox.' : 'Por confirmar')}<small>${esc(o.destino)}</small></dd></div>
      <div><dt>Última ubicación</dt><dd>${ub ? esc(ub.lugar) : 'Sin reportes'}<small>${ub ? esc(fCorta(ub.fecha)) + (urlOk(ub.mapa) ? ` · <a href="${esc(urlOk(ub.mapa))}" target="_blank" rel="noopener">ver mapa</a>` : '') : '&nbsp;'}</small></dd></div>
    </dl>
  </section>
  ${S.rol === 'csa' ? '<p class="aviso">Arriba ves el rastreo tal como lo ve el cliente. Los eventos marcados "Solo interno" no los ve.</p>' : ''}
  ${S.rol === 'transportista' ? tarjetaFoto(o) + tarjetaComentario(o) : ''}
  ${S.rol === 'csa' ? tarjetaComentario(o) : ''}
  <section class="panel card"><h3>Documentos</h3>
    <div class="docs">
      ${urlOk(o.pdf) ? `<a class="doc" href="${esc(urlOk(o.pdf))}" target="_blank" rel="noopener"><span class="ic" style="--c:var(--st-doc)">PDF</span><span><div class="dn">Orden de carga</div><div class="dm">${esc(o.folio)}.pdf</div></span></a>` : '<span class="vacio">El PDF de la orden de carga aún no está disponible.</span>'}
      ${tickets.map(e => `<a class="doc" href="${esc(urlOk(e.foto))}" target="_blank" rel="noopener"><span class="ic" style="--c:var(--st-ok)">FOTO</span><span><div class="dn">${esc(e.titulo)}</div><div class="dm">${esc((e.detalle.match(/Neto [^·]+/)||[''])[0])}</div></span></a>`).join('')}
    </div>
  </section>
  ${fotos.length ? `<section class="panel card"><h3>Fotos del viaje</h3><div class="fotos">${fotos.map(e => `<figure class="foto"><a href="${esc(urlOk(e.foto))}" target="_blank" rel="noopener"><img src="${esc(imgDbx(e.foto))}" alt="${esc(e.titulo)}" loading="lazy"></a><figcaption>${esc(e.titulo)} · ${esc(fCorta(e.fecha))}</figcaption></figure>`).join('')}</div></section>` : ''}
  <section class="panel card"><h3>Datos del viaje</h3>
    <dl class="datos">
      <div><dt>Origen</dt><dd>${esc(o.origen)}</dd></div><div><dt>Destino</dt><dd>${esc(o.destino)}</dd></div>
      <div><dt>Producto</dt><dd>${esc(o.productos)}</dd></div><div><dt>Cantidad</dt><dd>${esc(o.cantidad)} ${esc(o.medida)}</dd></div>
      <div><dt>Placas</dt><dd>${esc(o.placas) || '—'}</dd></div><div><dt>Operador</dt><dd>${esc(o.operador) || '—'}</dd></div>
      <div><dt>Remisión</dt><dd>${esc(o.remision) || '—'}</dd></div><div><dt>Certificado</dt><dd>${esc(o.certificados) || '—'}</dd></div>
      ${o.transporte ? `<div><dt>Transportista</dt><dd>${esc(o.transporte)}</dd></div>` : ''}${o.cuenta ? `<div><dt>Cliente</dt><dd>${esc(o.cuenta)}</dd></div>` : ''}
    </dl>
  </section>
  <section class="panel card"><h3>Historia del viaje</h3>
    <ol class="tl">${ev.map(e => `<li class="ev" style="--c:var(${COLOR_TIPO[e.tipo] || '--accent'})"><span class="dot"></span>
      <div class="when">${esc(fCorta(e.fecha))} · ${esc(e.tipo)}</div><div class="t">${esc(e.titulo)}${e.visible === false ? '<span class="interno">Solo interno</span>' : ''}</div>
      ${e.detalle ? `<div>${esc(e.detalle)}</div>` : ''}
      ${e.eta ? `<div>Llegada estimada: ${esc(fCorta(e.eta))}</div>` : ''}
      <div class="by">${esc(e.autor)}${urlOk(e.liga) ? ` · <a href="${esc(urlOk(e.liga))}" target="_blank" rel="noopener">${e.tipo==='Ubicación'||e.tipo==='Foto'?'Ver en mapa':e.tipo==='Documento'?'Abrir PDF':'Abrir'}</a>` : ''}${urlOk(e.foto) && S.rol !== 'cliente' ? ` · <a href="${esc(urlOk(e.foto))}" target="_blank" rel="noopener">Ver foto</a>` : ''}${S.rol === 'csa' && e.id ? ` · <button class="lnk" type="button" data-vis="${esc(e.id)}" data-v="${e.visible ? '0' : '1'}">${e.visible ? 'Ocultar al cliente' : 'Mostrar al cliente'}</button>` : ''}</div></li>`).join('') || '<li class="vacio">Sin movimientos todavía.</li>'}</ol>
  </section>`;
  conectarAcciones(o);
}

/* ---------- Acciones de transportista y CSA ---------- */
function tarjetaFoto(o){
  return `<section class="panel card"><h3>Reportar foto del viaje</h3>
  <div class="form">
    <label>Qué vas a reportar<select id="fTipo">${Object.entries(TIPOS_FOTO).map(([k,v]) => `<option value="${k}">${esc(v)}</option>`).join('')}</select></label>
    <label class="camara" for="fArchivo"><span id="fTxt">Toca aquí para tomar la foto</span><img id="fVista" alt="" hidden></label>
    <input id="fArchivo" type="file" accept="image/*" capture="environment" hidden>
    <p class="nota" id="fGps">La ubicación se toma al momento de la foto.</p>
    <label>Comentario (opcional)<textarea id="fObs" maxlength="300" placeholder="Ej. cargado y sellado, saliendo de la mina"></textarea></label>
    <button class="btn" id="fEnviar" type="button" disabled>Enviar foto</button>
    <p class="nota" id="fMsg" role="status"></p>
  </div></section>`;
}
function tarjetaComentario(o){
  const csa = S.rol === 'csa';
  return `<section class="panel card"><h3>${csa ? 'Escribir en la historia' : 'Nota para CSA'}</h3>
  <div class="form">
    <label>Comentario (opcional si pones la llegada)<input id="cTitulo" maxlength="120" placeholder="${csa ? 'Ej. La unidad llegará después de comer' : 'Ej. Hay fila para cargar'}"></label>
    <label>Detalle (opcional)<textarea id="cDetalle" maxlength="500"></textarea></label>
    <div class="fila">
      <label>Llegada estimada (opcional)<input id="cEta" type="datetime-local"></label>
      ${csa ? '<label class="chk"><input id="cVisible" type="checkbox" checked> Visible para el cliente</label>' : ''}
    </div>
    ${csa ? '' : '<p class="nota">Tu nota la revisa CSA antes de que la vea el cliente.</p>'}
    <button class="btn" id="cEnviar" type="button">${csa ? 'Publicar' : 'Enviar a CSA'}</button>
    <p class="nota" id="cMsg" role="status"></p>
  </div></section>`;
}
let foto = null, fotoEdad = null, gps = null;
function pedirGps(){
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res(p), () => res(null), { enableHighAccuracy:true, timeout:20000, maximumAge:0 });
  });
}
function sellar(c, texto){
  const x = c.getContext('2d'), h = Math.max(22, Math.round(c.width / 40));
  x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, c.height - h * 1.6, c.width, h * 1.6);
  x.fillStyle = '#fff'; x.font = `${h}px sans-serif`; x.fillText(texto, h * .5, c.height - h * .5);
}
function conectarAcciones(o){
  document.querySelectorAll('[data-vis]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const j = await api({ accion:'visibilidadEvento', sesion:S.sesion, id:b.dataset.vis, visible:b.dataset.v === '1' }).catch(() => ({}));
    if (j.ok) { cargarDetalle(o.clave); cargarLista(); } else b.disabled = false;
  });
  const cE = $('#cEnviar');
  if (cE) cE.onclick = async () => {
    const titulo = $('#cTitulo').value.trim();
    if (!titulo && !$('#cEta').value) { $('#cMsg').textContent = 'Escribe el comentario o la llegada estimada.'; return; }
    cE.disabled = true; $('#cMsg').textContent = 'Enviando…';
    try {
      const j = await api({ accion:'comentarOCa', sesion:S.sesion, clave:o.clave, titulo, detalle:$('#cDetalle').value, eta:$('#cEta').value,
                            visible: $('#cVisible') ? $('#cVisible').checked : false });
      $('#cMsg').textContent = j.mensaje || (j.ok ? 'Listo.' : 'No se pudo guardar.');
      if (j.ok) { $('#cTitulo').value = ''; $('#cDetalle').value = ''; $('#cEta').value = ''; setTimeout(() => cargarDetalle(o.clave), 800); }
    } catch (e) { $('#cMsg').textContent = 'Sin conexión. Intenta de nuevo.'; }
    finally { cE.disabled = false; }
  };
  const fA = $('#fArchivo');
  if (!fA) return;
  foto = null; gps = null;
  fA.onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    fotoEdad = Math.round((Date.now() - f.lastModified) / 1000);
    $('#fGps').textContent = 'Buscando señal GPS…';
    const pGps = pedirGps();
    const img = new Image();
    img.onload = async () => {
      gps = await pGps;
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const ahora = new Date().toLocaleString('es-MX', { timeZone:'America/Mexico_City' });
      sellar(c, `${o.folio} · ${ahora}` + (gps ? ` · ${gps.coords.latitude.toFixed(5)}, ${gps.coords.longitude.toFixed(5)}` : ''));
      const url = c.toDataURL('image/jpeg', 0.82);
      foto = url.split(',')[1];
      $('#fVista').src = url; $('#fVista').hidden = false; $('#fTxt').hidden = true;
      $('#fGps').textContent = gps ? `Ubicación lista (precisión ${Math.round(gps.coords.accuracy)} m).` : 'No se obtuvo la ubicación. Activa el GPS y permite la ubicación para esta página.';
      $('#fEnviar').disabled = !gps && S.rol === 'transportista';
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => { $('#fMsg').textContent = 'No se pudo abrir la foto, intenta de nuevo.'; };
    img.src = URL.createObjectURL(f);
  };
  $('#fEnviar').onclick = async () => {
    if (!foto) return;
    const b = $('#fEnviar'); b.disabled = true; $('#fMsg').textContent = 'Enviando foto…';
    try {
      const j = await api({ accion:'reportarFotoOCa', sesion:S.sesion, clave:o.clave, tipo:$('#fTipo').value, obs:$('#fObs').value,
        imagen:foto, fotoEdadSeg:fotoEdad, lat:gps ? gps.coords.latitude : '', lng:gps ? gps.coords.longitude : '',
        precision:gps ? gps.coords.accuracy : '', fechaGps:gps ? gps.timestamp : '' });
      $('#fMsg').textContent = j.mensaje || (j.ok ? 'Foto enviada.' : 'No se pudo enviar.');
      if (j.ok) { foto = null; $('#fVista').hidden = true; $('#fTxt').hidden = false; $('#fObs').value = ''; setTimeout(() => cargarDetalle(o.clave), 800); }
      else b.disabled = false;
    } catch (e) { $('#fMsg').textContent = 'Sin señal. Intenta de nuevo cuando tengas internet.'; b.disabled = false; }
  };
}

/* ---------- Arranque ---------- */
if (S.sesion) mostrarApp(); else $('#login').hidden = false;
setInterval(() => { if (S.sesion && !document.hidden) cargarLista(); }, 120000);
</script>
